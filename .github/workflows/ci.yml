name: CI

# Branch commits are covered by pull_request; push only runs for main, so a PR
# commit does not start two identical runs.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Merging deploys, and the production build pushes migrations in name
      # order, so a migration older than main's newest would fail that deploy.
      # A pull request is checked against its base as fetched when its CI ran,
      # so a stale one merged after a newer migration landed (the admin bypass
      # does not wait for a re-run) would slip through. The push to main checks
      # again, against the main it replaced, and names the file to rename.
      - name: Check migration order
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || github.event.before }}
        run: |
          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            echo "No previous commit to compare against."
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          bash scripts/check-migration-order.sh FETCH_HEAD

      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Installs the Supabase CLI too, at the version the lockfile pins, so CI
      # starts the same containers as a local `pnpm exec supabase start`.
      - run: pnpm install --frozen-lockfile

      # Applies every migration in supabase/migrations to a throwaway database,
      # so a schema change that the app code does not match fails here rather
      # than in a deploy. Nothing remote is touched. Only db, auth, kong, rest,
      # meta, and storage are started: the RLS suite, the type check, and the
      # build need nothing else, and every excluded image is one fewer pull from
      # a rate-limited registry.
      - name: Start Supabase
        run: pnpm exec supabase start -x studio,edge-runtime,imgproxy,analytics,vector,realtime,inbucket

      # Types come from the migrations, so a migration committed without its
      # regenerated types, or types edited by hand, fails here.
      - name: Check generated types
        run: |
          pnpm types:supabase
          git diff --exit-code -- src/lib/supabase/database.types.ts

      - name: Export Supabase env
        run: |
          status="$(pnpm exec supabase status -o json)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(jq -r .API_URL <<<"$status")"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(jq -r .ANON_KEY <<<"$status")"
            echo "SUPABASE_SECRET_KEY=$(jq -r .SERVICE_ROLE_KEY <<<"$status")"
            echo "SUPABASE_JWT_SECRET=$(jq -r .JWT_SECRET <<<"$status")"
            echo "SUPABASE_DB_URL=$(jq -r .DB_URL <<<"$status")"
          } >> "$GITHUB_ENV"

      # The RLS policies are the only thing standing between one member and
      # another member's data, and nothing else in CI exercises them. The
      # throwaway database above already has every migration applied, and
      # SUPABASE_DB_URL points the suite at it.
      - name: Verify RLS policies
        run: pnpm test:rls

      # Vitest against the same throwaway database. Lives here rather than in
      # `verify` because that job starts no database. Each test tags its
      # fixtures and deletes them afterwards, so this is safe to run after the
      # RLS suite and would be safe on a seeded database too.
      - name: Integration tests
        run: pnpm test:integration

      # Square credentials are never exercised by the build; these placeholders
      # only satisfy the module-scope checks in src/lib/square/client.ts.
      - name: Build
        env:
          SQUARE_ACCESS_TOKEN: ci-placeholder
          SQUARE_WEBHOOK_SIGNATURE_KEY: ci-placeholder
          NEXT_PUBLIC_SQUARE_APP_ID: ci-placeholder
          NEXT_PUBLIC_SQUARE_LOCATION_ID: ci-placeholder
        run: pnpm build
